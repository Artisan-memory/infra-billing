name: Build&Push Docker Image

# Builds on GitHub's runners so a server never has to: `npm ci` plus the Vite build peak well past
# what a small VPS has, and building there swaps the box to a halt.
on:
  push:
    branches:
      - main
      - dev
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

# A newer push supersedes a running build of the same ref, so a tag never lands on an older commit.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: meta
        run: |
          # Image references must be lowercase; an owner name may not be.
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # A "-dev" suffix makes the build badge read "dev" and link to the dev branch.
          suffix=${{ github.ref == 'refs/heads/dev' && '-dev' || '' }}
          echo "version=$(jq -r .version package.json)$suffix" >> "$GITHUB_OUTPUT"
          echo "channel=${{ github.ref == 'refs/heads/dev' && 'dev' || 'latest' }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            GIT_COMMIT=${{ github.sha }}
          # `latest` follows main, `dev` follows dev; a tag push additionally publishes that tag.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.channel }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', steps.meta.outputs.image, github.ref_name) || '' }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.channel }}

  create-release:
    name: Create release
    needs: [build-docker-image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          body: |
            Docker image:
            - `${{ needs.build-docker-image.outputs.image }}:${{ github.ref_name }}`
            - `${{ needs.build-docker-image.outputs.image }}:latest`
